# data_pipeline 内部步骤（对应 DAG 节点）
- id: import_csv
  severity: mutating
  tier: default
  tool: data_csv_to_datatable
  tool_args:
    csv_path: "/Content/Data/balance.csv"
    table_name: "DT_Balance"

- id: validate_rows
  dependencies: [import_csv]
  severity: read_only
  tier: fast
  tool: data_validate_rows
