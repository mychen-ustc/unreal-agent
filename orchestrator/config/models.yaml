# 模型映射配置（TDR-010）：LiteLLM 封装 + 三档路由
# 读取 .env（LLM_BASE_URL / LLM_API_KEY / MODEL_STRONG / MODEL_DEFAULT / MODEL_FAST）
# 供应商为 OpenAI-compatible 统一网关：只配 base_url + model_name 即可按需调用任意模型。
# 参考：TechDesign §2.3 / §6.3；environment-setup.md §7。

# 供应商端点（通常来自 LLM_BASE_URL）
supplier:
  # LiteLLM 的 OpenAI-compatible provider 前缀（deepseek / openai / oneapi / ...）
  name: "${MODEL_PROVIDER:-deepseek}"
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"

# 三档路由（约定档位 -> model_name），默认值可用 .env 的 MODEL_* 覆盖。
routing:
  strong:   # 复杂推理：玩法设计 / PCG 参数规划 / 代码生成 / 评审
    model: "${MODEL_STRONG:-deepseek-v4-pro}"
  default:  # 主力：多数 Agent 任务 / Tool 调用 / GDD 撰写
    model: "${MODEL_DEFAULT:-deepseek-v4-flash}"
  fast:     # 简单/高频：格式化 / 摘要 / 分类 / 命名校验
    model: "${MODEL_FAST:-deepseek-v4-flash}"

# 生成参数默认值（按档位可选覆盖）
generation:
  temperature: 0.3           # 研发产物偏确定性
  max_tokens: 8192
  timeout_seconds: 90

# 错误重试
retry:
  max_attempts: 3            # 单次 LLM 调用的退避重试
  backoff_base_seconds: 1.5
